<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Պրոֆիլ — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Իմ պրոֆիլը'))</script><main class="page"><div id="profile-head" class="card profile-head"></div><form id="profile-form" class="card profile-form" style="padding:16px;margin-top:12px"><div class="field"><label>Անուն Ազգանուն</label><input name="full_name" required></div><div class="field"><label>Հեռախոս</label><input name="phone" type="tel" required></div><button class="btn btn-gold wide">Պահպանել փոփոխությունները</button></form><div class="card menu" style="margin-top:12px"><a href="orders.html"><span>▤</span>Պատվերների պատմություն<span>›</span></a><a href="addresses.html"><span>⌖</span>Առաքման հասցեներ<span>›</span></a><a href="payments.html"><span>֏</span>Վճարման կարգավիճակ<span>›</span></a><a href="push.html"><span>◉</span>Push ծանուցումներ<span>›</span></a><a href="notifications.html"><span>♢</span>Ծանուցումներ<span>›</span></a><a href="mailto:info@gdprint.am"><span>?</span>Օգնություն / կապ<span>›</span></a></div><button class="btn btn-outline wide" style="margin-top:14px;color:#d33" onclick="customerLogout()">Դուրս գալ</button></main><script>document.write(renderBottomNav('profile'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{const c=await requireCustomer();if(!c)return;const f=document.getElementById('profile-form');f.full_name.value=c.customer.full_name||'';f.phone.value=c.customer.phone||'';const initial=(c.customer.full_name||'Հ')[0].toUpperCase();document.getElementById('profile-head').innerHTML=`<div class="avatar">${esc(initial)}</div><div><h2 style="margin:0 0 5px">${esc(c.customer.full_name||'Հաճախորդ')}</h2><div class="meta">${esc(c.customer.phone||'')}<br>${esc(c.session.user.email||'')}</div></div>`;f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const {error}=await supabaseClient.rpc('update_customer_profile',{p_full_name:f.full_name.value.trim(),p_phone:f.phone.value.trim()});if(error)throw error;showAppMessage('Տվյալները պահպանված են','success');setTimeout(()=>location.reload(),700)}catch(x){showAppMessage(x.message)}finally{b.disabled=false}}})();</script></body></html>
