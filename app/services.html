<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Ծառայություններ — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Ծառայություններ'))</script><main class="page"><div class="section-head"><div><h2 style="margin:0">Ծառայությունների կատալոգ</h2><p class="meta" style="margin:4px 0 0">Բոլոր 11 GDprint ծառայությունները</p></div><span class="status-chip gold">11 ծառայություն</span></div><input id="search" class="search" placeholder="Որոնել ծառայություն..."><div id="service-list" class="service-list" style="margin-top:12px"></div></main><script>document.write(renderBottomNav('services'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());const box=document.getElementById('service-list');const renderServices=q=>{const qq=(q||'').trim().toLowerCase();const services=(window.GD&&Array.isArray(window.GD.services))?window.GD.services:[];box.innerHTML=services.filter(s=>(s[1]+' '+s[2]).toLowerCase().includes(qq)).map(s=>`<a class="card service" href="service.html?key=${s[0]}">${serviceImage(s[3],s[1])}<div><h3>${s[1]}</h3><p>${s[2]}</p></div><span class="chev">›</span></a>`).join('')||'<div class="card empty-state"><b>Ծառայություն չի գտնվել</b></div>'};renderServices('');document.getElementById('search').addEventListener('input',e=>renderServices(e.target.value));(async()=>{await requireCustomer()})();</script></body></html>
