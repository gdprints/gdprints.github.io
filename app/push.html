<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Push ծանուցումներ — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Push ծանուցումներ'))</script><main class="page"><section class="card" style="padding:18px"><h2 style="margin-top:0">Ծանուցումներ հեռախոսի վրա</h2><p class="meta">Ստացեք պատվերի կարգավիճակի, դիզայնի հաստատման և պատրաստ լինելու մասին ծանուցումներ նույնիսկ երբ հավելվածը փակ է։</p><div class="setting-row"><div><b>Push notifications</b><div class="meta" id="state">Ստուգվում է...</div></div><button id="toggle" class="toggle" aria-label="Փոխել"></button></div><div class="quote-box" style="margin-top:14px">iPhone-ում Web Push-ը աշխատում է, երբ GDprint PWA-ն ավելացված է Home Screen-ում։</div></section></main><script>document.write(renderBottomNav('profile'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;if('serviceWorker'in navigator)await navigator.serviceWorker.register('sw.js');const b=document.getElementById('toggle'),st=document.getElementById('state');async function sync(){const on=await pushEnabled();b.classList.toggle('on',on);st.textContent=on?'Միացված է':'Անջատված է'}await sync();b.onclick=async()=>{b.disabled=true;try{if(await pushEnabled()){await disablePushNotifications();showAppMessage('Push ծանուցումներն անջատված են','success')}else{await enablePushNotifications();showAppMessage('Push ծանուցումները միացված են','success')}}catch(e){showAppMessage(e.message)}finally{b.disabled=false;await sync()}}})();</script></body></html>
