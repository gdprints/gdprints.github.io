<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1,viewport-fit=cover,viewport-fit=cover" name="viewport">
<link href="assets/css/app.css" rel="stylesheet">
<link href="assets/css/premium-red.css?v=750" rel="stylesheet">
<title>Գրանցում — GDprint</title>
<meta content="yes" name="apple-mobile-web-app-capable">
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
<meta content="#090b0f" name="theme-color">
</head>
<body>
<main class="auth-shell"><div class="auth-brand">
<span class="brand-logo-wrap large"><img alt="GDprint" class="brand-logo" src="assets/img/gdprint-logo.png"></span><div class="brand-tagline">PRINT • DESIGN • DELIVER</div>
<p>Ստեղծեք ձեր GDprint հաճախորդի հաշիվը</p>
</div>
<section class="auth-card"><div class="tabs">
<button class="tab" data-gd-click-handler="e001">Մուտք</button><button class="tab active">Գրանցում</button>
</div>
<form id="register-form">
<div class="field">
<label>Անուն Ազգանուն</label><input name="full_name" placeholder="Արամ Մանուկյան" required="">
</div>
<div class="field">
<label>Հեռախոս</label><input name="phone" placeholder="+374 ..." required="" type="tel">
</div>
<div class="field">
<label>Էլ․ հասցե</label><input name="email" placeholder="name@example.com" required="" type="email">
</div>
<div class="field">
<label>Գաղտնաբառ</label><input minlength="8" name="password" placeholder="Առնվազն 8 նիշ" required="" type="password">
</div>
<div class="auth-error" id="register-error"></div>
<button class="btn btn-gold wide" type="submit">Ստեղծել հաշիվ</button>
</form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="../data/generated/services.catalog.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script src="assets/js/pages/register/inline-01.js"></script><script src="assets/js/pages/register/events.js"></script>
</body>
</html>
