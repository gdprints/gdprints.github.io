<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Գրանցում — GDprint</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><main class="auth-shell"><div class="auth-brand"><img src="assets/img/logo-dark.png"><p>Ստեղծեք ձեր GDprint հաճախորդի հաշիվը</p></div><section class="auth-card"><div class="tabs"><button class="tab" onclick="location.href='index.html'">Մուտք</button><button class="tab active">Գրանցում</button></div><form id="register-form"><div class="field"><label>Անուն Ազգանուն</label><input name="full_name" placeholder="Արամ Մանուկյան" required></div><div class="field"><label>Հեռախոս</label><input name="phone" type="tel" placeholder="+374 ..." required></div><div class="field"><label>Էլ․ հասցե</label><input name="email" type="email" placeholder="name@example.com" required></div><div class="field"><label>Գաղտնաբառ</label><input name="password" type="password" minlength="8" placeholder="Առնվազն 8 նիշ" required></div><div id="register-error" class="auth-error"></div><button class="btn btn-gold wide" type="submit">Ստեղծել հաշիվ</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());document.getElementById('register-form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),er=document.getElementById('register-error');er.style.display='none';b.disabled=true;b.textContent='Գրանցվում է...';try{const d=await customerRegister({full_name:f.full_name.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim(),password:f.password.value});if(d.session){location.href='home.html'}else{er.style.background='#edf8f2';er.style.color='#187a4a';er.textContent='Գրանցումը հաջող է։ Եթե Supabase-ում Email confirmation-ը միացված է, հաստատեք ձեր էլ․ հասցեն և ապա մուտք գործեք։';er.style.display='block';b.disabled=false;b.textContent='Ստեղծել հաշիվ'}}catch(x){er.textContent=x.message||'Գրանցումը չհաջողվեց';er.style.display='block';b.disabled=false;b.textContent='Ստեղծել հաշիվ'}})</script></body></html>
