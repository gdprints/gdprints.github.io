<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><script src="assets/js/app.js"></script><title>Վճարման կարգավիճակ — GDprint</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Վճարման կարգավիճակ'))</script><main class="page"><section class="page-intro"><span class="eyebrow">ՖԻՆԱՆՍԱԿԱՆ ԲԱԺԻՆ</span><h1>Իմ պատվերների վճարումները</h1><p>Այստեղ միայն երևում է վճարման կարգավիճակը։ Առցանց վճարում հավելվածից չի կատարվում։</p></section><div id="payment-list" class="stack-list"><div class="card empty-state"><b>Բեռնվում է...</b></div></div></main><script>document.write(renderBottomNav('orders'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;try{const orders=await loadMyOrders(100),box=document.getElementById('payment-list');box.innerHTML=orders.length?orders.map(o=>`<a class="card payment-list-card" href="order.html?no=${encodeURIComponent(o.order_number)}"><div><div class="order-no">#${esc(o.order_number)}</div><div class="meta">${esc(o.service_name||'Պատվեր')}</div></div><div class="payment-right"><b>${Number(o.total_amount)>0?money(o.total_amount):'Պայմանագրային'}</b><span class="payment-status ${o.payment_status==='paid'?'paid':''}">${esc(paymentStatusLabel(o.payment_status))}</span></div></a>`).join(''):'<div class="card empty-state"><b>Պատվերներ դեռ չկան</b></div>'}catch(e){showAppMessage(e.message)}})();</script></body></html>
