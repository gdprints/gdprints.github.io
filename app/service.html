<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Պատվերի հաշվիչ — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Պատվերի հաշվիչ'))</script><main class="page"><form id="service-form" class="card" style="padding:18px"><div id="svc" class="service-art" style="width:100%;height:120px;font-size:28px"></div><h2 id="name" style="margin-bottom:4px"></h2><p id="desc" class="meta"></p><div id="fields"></div><div class="field"><label>Պատվերի նկարագրություն</label><textarea name="description" placeholder="Գրեք անհրաժեշտ մանրամասները..."></textarea></div><div id="live-price" class="price-panel"></div><button class="btn btn-gold wide" type="submit">Շարունակել՝ ֆայլերի վերբեռնում →</button></form></main><script>document.write(renderBottomNav('services'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script src="assets/js/pricing.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;const key=new URLSearchParams(location.search).get('key')||'business_cards',s=serviceByKey(key);document.getElementById('name').textContent=s[1];document.getElementById('desc').textContent=s[2];document.getElementById('svc').innerHTML=`<img class="service-detail-image" src="${s[3]}" alt="${esc(s[1])}" referrerpolicy="no-referrer">`;document.getElementById('fields').innerHTML=serviceFields(key);const f=document.getElementById('service-form');const calc=()=>renderPrice(key,f);f.addEventListener('input',calc);f.addEventListener('change',calc);calc();f.addEventListener('submit',e=>{e.preventDefault();const r=renderPrice(key,f),raw=formDetails(f);sessionStorage.setItem('gdOrderDraft',JSON.stringify({service_key:key,service_name:s[1],details:r.normalized,description:f.description.value.trim(),client_price:r.amount,contractual:!!r.contractual}));sessionStorage.removeItem('gdUploadedFiles');sessionStorage.removeItem('gdDraftId');location.href='upload.html'})})();</script></body></html>
