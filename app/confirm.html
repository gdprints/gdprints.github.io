<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Հաստատում — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Պատվերի հաստատում'))</script><main class="page"><section class="card" style="padding:18px"><div style="width:64px;height:64px;border-radius:50%;background:#e8f7ee;color:#179252;display:grid;place-items:center;font-size:32px;margin:auto">✓</div><h2 style="text-align:center">Ստուգեք պատվերը</h2><div id="summary" class="summary-list"></div><section class="delivery-select card" style="padding:14px;margin:14px 0;background:#fafafa"><div class="field"><label>Ստացման եղանակ</label><select id="delivery-method"><option value="pickup">Ինքնուրույն ստացում GDprint-ից</option><option value="delivery">Առաքում հասցեով</option></select></div><div id="delivery-address-wrap" class="field" style="display:none"><label>Առաքման ամբողջական հասցե</label><input id="delivery-address-line" type="text" autocomplete="street-address" placeholder="Օր․ ք. Երևան, Կոմիտասի պող. 25, շենք 2, բն. 14"><div class="meta" style="margin-top:7px">Մուտքագրեք ամբողջ հասցեն մեկ տողով։ Առաքման արժեքը պատվերը ստանալուց հետո կնշի Admin-ը։</div></div></section><div class="price-panel"><span>Վերջնական հաշվարկ</span><div id="price"></div></div><button id="confirm-btn" class="btn btn-gold wide">Հաստատել և գրանցել պատվերը</button><button class="btn btn-outline wide" style="margin-top:10px" onclick="history.back()">← Վերադառնալ</button></section></main><script>document.write(renderBottomNav('services'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script src="assets/js/pricing.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;const draft=JSON.parse(sessionStorage.getItem('gdOrderDraft')||'null');if(!draft){location.href='services.html';return}const files=JSON.parse(sessionStorage.getItem('gdUploadedFiles')||'[]');const r=gdCalculatePrice(draft.service_key,draft.details);const s=serviceByKey(draft.service_key);const labels={quantity:'Քանակ',size:'Չափս',width:'Լայնություն',height:'Բարձրություն',material:'Նյութ',package_rate:'Փաթեթի գին',border_cut:'Եզրագծային կտրվածք',eyelet_count:'Ողակներ',print_type:'Տպագրության տեսակ',square_meters:'Քառակուսի մետր',company_name:'Ընկերություն',company_address:'Հասցե',weight:'Թղթի խտություն',paper_type:'Թղթի տեսակ',calendar_type:'Օրացույցի տեսակ'};let rows=`<div class="summary-row"><span>Ծառայություն</span><b>${esc(s[1])}</b></div>`;Object.entries(r.normalized||{}).filter(([k,v])=>v!==''&&v!=null&&k!=='quote_required').forEach(([k,v])=>rows+=`<div class="summary-row"><span>${esc(labels[k]||k)}</span><b>${esc(v)}</b></div>`);rows+=`<div class="summary-row"><span>Ֆայլեր</span><b>${files.length} հատ</b></div>`;if(draft.description)rows+=`<div class="summary-row"><span>Նկարագրություն</span><b>${esc(draft.description)}</b></div>`;document.getElementById('summary').innerHTML=rows;const method=document.getElementById('delivery-method'),addr=document.getElementById('delivery-address-line'),wrap=document.getElementById('delivery-address-wrap');const prev=draft.delivery||{};method.value=prev.method||'pickup';addr.value=prev.snapshot?.address_line||prev.address_line||'';function syncDelivery(){wrap.style.display=method.value==='delivery'?'block':'none';const line=addr.value.trim();draft.delivery={method:method.value,address_id:null,snapshot:method.value==='delivery'?{label:'Առաքման հասցե',recipient_name:GDCustomer.customer?.full_name||'',phone:GDCustomer.customer?.phone||'',city:'',address_line:line,note:''}:null};sessionStorage.setItem('gdOrderDraft',JSON.stringify(draft))}method.onchange=syncDelivery;addr.oninput=syncDelivery;syncDelivery();document.getElementById('price').innerHTML=r.contractual?'<b>Պայմանագրային</b><small>Վերջնական գինը կհաստատի GDprint-ը</small>':`<b>${money(r.amount)}</b><small>Հաշվարկված է սերվերի նույն կանոններով</small>`;document.getElementById('confirm-btn').onclick=async()=>{const b=document.getElementById('confirm-btn');b.disabled=true;b.textContent='Գրանցվում է...';try{if(method.value==='delivery'&&!addr.value.trim()){throw new Error('Մուտքագրեք առաքման ամբողջական հասցեն։')}syncDelivery();const order=await submitCustomerOrder(draft,files);location.href='order.html?no='+encodeURIComponent(order.order_number)+'&created=1'}catch(e){showAppMessage(e.message);b.disabled=false;b.textContent='Հաստատել և գրանցել պատվերը'}}})();</script></body></html>
