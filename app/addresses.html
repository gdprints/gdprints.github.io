<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Առաքման հասցեներ — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Առաքման հասցեներ'))</script><main class="page"><div id="list"></div><section class="card" style="padding:16px;margin-top:12px"><h2 id="form-title" style="margin-top:0">Նոր հասցե</h2><form id="f"><input type="hidden" name="id"><div class="field"><label>Անվանում</label><input name="label" placeholder="Տուն / Գրասենյակ" required></div><div class="field-grid"><div class="field"><label>Ստացող</label><input name="recipient_name" required></div><div class="field"><label>Հեռախոս</label><input name="phone" required></div></div><div class="field"><label>Քաղաք</label><input name="city" value="Երևան" required></div><div class="field"><label>Հասցե</label><input name="address_line" placeholder="Փողոց, շենք, բնակարան" required></div><div class="field"><label>Նշում</label><textarea name="note" placeholder="Մուտք, հարկ, դոմոֆոն..."></textarea></div><label style="display:flex;gap:9px;align-items:center;margin:10px 0 15px"><input name="is_default" type="checkbox"> Օգտագործել որպես հիմնական հասցե</label><button class="btn btn-gold wide">Պահպանել հասցեն</button></form></section></main><script>document.write(renderBottomNav('profile'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());let rows=[];async function draw(){rows=await loadAddresses();document.getElementById('list').innerHTML=rows.length?rows.map(a=>`<div class="card address-card ${a.is_default?'default':''}"><div class="address-title"><b>${esc(a.label)}</b>${a.is_default?'<span class="status-chip gold">Հիմնական</span>':''}</div><div class="meta">${esc(a.recipient_name)} • ${esc(a.phone)}<br>${esc(a.city)}, ${esc(a.address_line)}${a.note?'<br>'+esc(a.note):''}</div><div class="address-actions"><button class="mini-btn" onclick="editA('${a.id}')">Խմբագրել</button><button class="mini-btn" onclick="delA('${a.id}')">Ջնջել</button></div></div>`).join(''):'<div class="card empty-state"><b>Հասցե դեռ չկա</b><span>Ավելացրեք առաքման հասցեն։</span></div>'}function editA(id){const a=rows.find(x=>x.id===id),f=document.getElementById('f');for(const k of ['id','label','recipient_name','phone','city','address_line','note'])f[k].value=a[k]||'';f.is_default.checked=!!a.is_default;document.getElementById('form-title').textContent='Խմբագրել հասցեն';scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}async function delA(id){if(!confirm('Ջնջե՞լ հասցեն։'))return;try{await deleteAddress(id);await draw()}catch(e){showAppMessage(e.message)}};(async()=>{const c=await requireCustomer();if(!c)return;await draw();const f=document.getElementById('f');f.recipient_name.value=c.customer.full_name||'';f.phone.value=c.customer.phone||'';f.onsubmit=async e=>{e.preventDefault();try{await saveAddress({id:f.id.value||null,label:f.label.value.trim(),recipient_name:f.recipient_name.value.trim(),phone:f.phone.value.trim(),city:f.city.value.trim(),address_line:f.address_line.value.trim(),note:f.note.value.trim(),is_default:f.is_default.checked});f.reset();f.recipient_name.value=c.customer.full_name||'';f.phone.value=c.customer.phone||'';f.city.value='Երևան';f.id.value='';document.getElementById('form-title').textContent='Նոր հասցե';showAppMessage('Հասցեն պահպանված է','success');await draw()}catch(x){showAppMessage(x.message)}}})();</script></body></html>
