<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Պատվերներ — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Իմ պատվերները'))</script><main class="page"><div class="tabs"><button id="tab-active" class="tab active">Ակտիվ</button><button id="tab-done" class="tab">Ավարտված</button></div><div id="orders" style="display:grid;gap:11px"></div></main><script>document.write(renderBottomNav('orders'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());let all=[];function draw(done=false){const final=['delivered','completed','cancelled'];const a=all.filter(o=>done?final.includes(o.status):!final.includes(o.status));document.getElementById('orders').innerHTML=a.length?a.map(orderCard).join(''):'<div class="card empty-state"><b>Պատվերներ չկան</b><span>Այս բաժնում համապատասխան պատվեր չկա։</span></div>'}function choose(done){document.getElementById('tab-active').classList.toggle('active',!done);document.getElementById('tab-done').classList.toggle('active',done);draw(done)}(async()=>{if(!await requireCustomer())return;try{all=await loadMyOrders();draw(false)}catch(e){showAppMessage(e.message)}})();document.getElementById('tab-active').onclick=()=>choose(false);document.getElementById('tab-done').onclick=()=>choose(true);</script></body></html>
