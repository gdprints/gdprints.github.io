<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Պատվերի հետևում — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Պատվերի հետևում'))</script><main class="page"><div id="order-head"></div><section id="timeline" class="card timeline"></section><div id="order-price" class="card order-card" style="margin-top:12px"></div><div id="proof"></div><div id="delivery"></div><div id="payment"></div><section class="card" style="padding:16px;margin-top:12px"><h3 style="margin-top:0">Հաղորդագրություն GDprint-ին</h3><div class="field"><textarea id="msg" placeholder="Գրեք հարցը կամ նշումը..."></textarea></div><button id="send-msg" class="btn btn-outline wide">Ուղարկել հաղորդագրություն</button></section></main><script>document.write(renderBottomNav('orders'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());const steps=[['pending','Պատվերն ընդունված է'],['design','Դիզայն / նախապատրաստում'],['printing','Տպագրություն'],['ready','Պատրաստ է'],['delivered','Առաքված է']];(async()=>{if(!await requireCustomer())return;const no=new URLSearchParams(location.search).get('no');try{const o=await loadOrderByNumber(no);if(!o)throw new Error('Պատվերը չի գտնվել');if(new URLSearchParams(location.search).get('created')){showAppMessage('Պատվերը հաջողությամբ գրանցվել է','success');if(sessionStorage.getItem('gdDeliveryWarning')==='1'){const de=sessionStorage.getItem('gdDeliveryError')||'';sessionStorage.removeItem('gdDeliveryWarning');sessionStorage.removeItem('gdDeliveryError');if(de)console.error('Delivery save error:',de);setTimeout(()=>showAppMessage('Պատվերը գրանցվել է, բայց առաքման հասցեն չի ամրացվել։ Խնդրում ենք տեղեկացնել GDprint-ին։','error'),700);}}document.getElementById('order-head').innerHTML=`<div class="row" style="margin:8px 0 14px"><div><div class="order-no">#${esc(o.order_number)}</div><div class="meta">${esc(o.service_name||o.service_key)}</div></div><span class="badge">${esc(statusLabel(o.status))}</span></div>`;const idx=steps.findIndex(x=>x[0]===o.status);document.getElementById('timeline').innerHTML=steps.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'current':''}"><div class="dot">${i<idx?'✓':i===idx?'•':''}</div><div><h4>${s[1]}</h4><p>${i<idx?'Ավարտված':i===idx?'Ընթացիկ փուլ':'Սպասվում է'}</p></div></div>`).join('')+(o.status==='cancelled'?'<div class="step current"><div class="dot">!</div><div><h4>Պատվերը չեղարկված է</h4><p>Կապվեք GDprint-ի հետ մանրամասների համար</p></div></div>':'');document.getElementById('order-price').innerHTML=`<div class="row"><span>Պատվերի արժեք</span><strong class="price" style="margin:0">${Number(o.total_amount)>0?money(o.total_amount):'Պայմանագրային'}</strong></div>`;const proof=await loadLatestProof(o.id);if(proof){let url=await signedFileUrl(proof.storage_path,900);document.getElementById('proof').innerHTML=`<section class="card proof-card"><div class="row"><h3 style="margin:0">Դիզայնի հաստատում</h3><span class="status-chip ${proof.status==='approved'?'green':proof.status==='changes_requested'?'red':'gold'}">${proof.status==='approved'?'Հաստատված է':proof.status==='changes_requested'?'Փոփոխություն է պահանջվել':'Սպասում է ձեր պատասխանին'}</span></div><p class="meta">Տարբերակ ${proof.version}</p><div class="proof-preview">${url&&/\.(png|jpe?g|webp)$/i.test(proof.file_name)?`<img src="${url}" alt="Դիզայն">`:`<a class="btn btn-outline" href="${url}" target="_blank">Բացել ${esc(proof.file_name)}</a>`}</div>${proof.status==='pending'?`<div class="field"><label>Մեկնաբանություն (եթե փոփոխություն է պետք)</label><textarea id="proof-comment" placeholder="Գրեք ինչ փոխել..."></textarea></div><div class="proof-actions"><button id="approve-proof" class="btn btn-success">✓ Հաստատել</button><button id="change-proof" class="btn btn-danger-soft">Փոփոխություն</button></div>`:''}</section>`;if(proof.status==='pending'){document.getElementById('approve-proof').onclick=async()=>{if(!confirm('Հաստատե՞լ դիզայնը տպագրության համար։'))return;try{await respondToProof(proof.id,'approved','');showAppMessage('Դիզայնը հաստատված է','success');setTimeout(()=>location.reload(),500)}catch(e){showAppMessage(e.message)}};document.getElementById('change-proof').onclick=async()=>{const c=document.getElementById('proof-comment').value.trim();if(!c)return showAppMessage('Գրեք՝ ինչ փոփոխություն է անհրաժեշտ');try{await respondToProof(proof.id,'changes_requested',c);showAppMessage('Փոփոխության պահանջն ուղարկված է','success');setTimeout(()=>location.reload(),500)}catch(e){showAppMessage(e.message)}}}}const delivery=await loadOrderDelivery(o.id);if(delivery&&delivery.delivery_method==='delivery'){const fee=Number(o.delivery_fee ?? delivery.delivery_fee ?? 0)||0;const base=Number(o.total_amount)||0;document.getElementById('delivery').innerHTML=`<section class="card" style="padding:16px;margin-top:12px"><b>Առաքում</b><div class="meta" style="margin-top:7px;line-height:1.65">${esc(delivery.address_line||'—')}<br>${esc(delivery.recipient_name||'')} ${delivery.phone?'• '+esc(delivery.phone):''}</div></section>`;document.getElementById('order-price').innerHTML=`<div class="summary-row"><span>Պատվերի արժեք</span><b>${base>0?money(base):'Պայմանագրային'}</b></div><div class="summary-row"><span>Առաքման արժեք</span><b>${fee>0?money(fee):'Կճշտվի Admin-ի կողմից'}</b></div>${base>0&&fee>0?`<div class="summary-row" style="padding-top:12px;margin-top:6px;border-top:1px solid var(--border)"><span><strong>Ընդհանուր արժեք</strong></span><b class="price">${money(base+fee)}</b></div>`:''}`;}else{document.getElementById('delivery').innerHTML=delivery?`<section class="card" style="padding:16px;margin-top:12px"><b>Ստացման եղանակ</b><div class="meta" style="margin-top:7px">Ինքնուրույն ստացում GDprint-ից</div></section>`:'';}document.getElementById('payment').innerHTML=`<section class="card payment-card" style="margin-top:12px"><div class="row"><div><b>Վճարման կարգավիճակ</b><div class="meta">Վճարումը կատարվում է GDprint-ի հետ համաձայնեցված եղանակով</div></div><span class="status-chip ${o.payment_status==='paid'?'green':o.payment_status==='deposit'?'gold':'red'}">${esc(paymentStatusLabel(o.payment_status))}</span></div></section>`;document.getElementById('send-msg').onclick=async()=>{const m=document.getElementById('msg').value.trim();if(!m)return;const {error}=await supabaseClient.rpc('add_customer_order_message',{p_order_id:o.id,p_message:m});if(error)return showAppMessage(error.message);document.getElementById('msg').value='';showAppMessage('Հաղորդագրությունն ուղարկված է','success')}}catch(e){showAppMessage(e.message)}})();</script></body></html>
