<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,viewport-fit=cover"><meta name="theme-color" content="#111318"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/app.css"><title>Մուտք — GDprint</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><main class="auth-shell"><div class="auth-brand"><img src="assets/img/logo-dark.png"><p>Ձեր տպագրությունը՝ միշտ ձեր ձեռքում</p></div><section class="auth-card"><div class="tabs"><button class="tab active">Մուտք</button><button class="tab" onclick="location.href='register.html'">Գրանցում</button></div><form id="login-form"><div class="field"><label>Էլ․ հասցե</label><input name="email" type="email" placeholder="name@example.com" autocomplete="email" required></div><div class="field"><label>Գաղտնաբառ</label><input name="password" type="password" placeholder="••••••••" autocomplete="current-password" required></div><div id="login-error" class="auth-error"></div><button class="btn btn-gold wide" type="submit">Մուտք գործել</button></form><p class="subtle">GDprint Customer App • Secure PWA</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(await currentCustomer())location.href='home.html'})();document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');const er=document.getElementById('login-error');er.style.display='none';b.disabled=true;b.textContent='Մուտք...';try{await customerSignIn(e.currentTarget.email.value.trim(),e.currentTarget.password.value);location.href='home.html'}catch(x){er.textContent=x.message||'Մուտքը չհաջողվեց';er.style.display='block';b.disabled=false;b.textContent='Մուտք գործել'}});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
