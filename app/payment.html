<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Վճարման կարգավիճակ — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Վճարման կարգավիճակ'))</script><main class="page"><div id="box" class="card payment-card"><div class="empty-state"><b>Բեռնվում է...</b></div></div></main><script>document.write(renderBottomNav('orders'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;const no=new URLSearchParams(location.search).get('no'),o=await loadOrderByNumber(no);if(!o)return showAppMessage('Պատվերը չի գտնվել');const d=await loadOrderDelivery(o.id);const fee=d?.delivery_method==='delivery'?(Number(d.delivery_fee)||0):0;const base=Number(o.total_amount)||0;document.getElementById('box').innerHTML=`<div class="row"><div><div class="order-no">#${esc(o.order_number)}</div><div class="meta">${esc(o.service_name||'')}</div></div><span class="payment-status ${o.payment_status==='paid'?'paid':''}">${esc(paymentStatusLabel(o.payment_status))}</span></div><div class="summary-list" style="margin:16px 0"><div class="summary-row"><span>Պատվերի արժեք</span><b>${base>0?money(base):'Պայմանագրային'}</b></div>${d?.delivery_method==='delivery'?`<div class="summary-row"><span>Առաքման արժեք</span><b>${fee>0?money(fee):'Կճշտվի Admin-ի կողմից'}</b></div>${base>0&&fee>0?`<div class="summary-row"><span><strong>Ընդհանուր արժեք</strong></span><b>${money(base+fee)}</b></div>`:''}`:''}</div><div class="meta" style="margin-bottom:14px">Առցանց վճարում հասանելի չէ։ Վճարման եղանակը համաձայնեցվում է GDprint-ի հետ։</div><a class="btn btn-outline wide" href="order.html?no=${encodeURIComponent(o.order_number)}">Վերադառնալ պատվերին</a>`})();</script></body></html>
