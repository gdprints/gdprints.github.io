<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="assets/css/app.css"><title>Ֆայլերի վերբեռնում — GDprint</title><script src="assets/js/app.js"></script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111318"></head><body><div class="app"><script>document.write(renderTopbar('Ֆայլերի վերբեռնում'))</script><main class="page"><section class="card" style="padding:18px"><div class="upload-zone"><h2 style="margin-top:0">Կցեք պատվերի ֆայլերը</h2><p class="meta">PDF, AI, PSD, PNG, JPG և այլ տպագրական ֆայլեր։ Մեկ ֆայլի առավելագույն չափը՝ 50MB։</p><input id="files" type="file" multiple><div style="margin-top:14px"><button id="upload-btn" class="btn btn-gold wide">Վերբեռնել ընտրված ֆայլերը</button></div></div><div id="uploaded" style="margin-top:14px"></div><button class="btn btn-outline wide" style="margin-top:14px" onclick="location.href='confirm.html'">Շարունակել առանց ֆայլի / Դեպի հաստատում →</button></section></main><script>document.write(renderBottomNav('services'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());let uploaded=JSON.parse(sessionStorage.getItem('gdUploadedFiles')||'[]');function draw(){document.getElementById('uploaded').innerHTML=uploaded.length?'<div class="card" style="padding:0 14px">'+uploaded.map(x=>`<div class="file-row"><div><b>${esc(x.file_name)}</b><div class="meta">${Math.round((x.file_size||0)/1024)} KB</div></div><span class="status-chip">Վերբեռնված</span></div>`).join('')+'</div>':'<div class="empty-state"><b>Ֆայլ դեռ չկա</b></div>'}(async()=>{if(!await requireCustomer())return;if(!sessionStorage.getItem('gdOrderDraft')){location.href='services.html';return}draw();document.getElementById('upload-btn').onclick=async()=>{const fs=[...document.getElementById('files').files];if(!fs.length)return showAppMessage('Ընտրեք առնվազն մեկ ֆայլ');for(const f of fs){if(f.size>50*1024*1024)return showAppMessage(f.name+' ֆայլը գերազանցում է 50MB-ը')}const b=document.getElementById('upload-btn');b.disabled=true;b.textContent='Վերբեռնվում է...';try{for(const f of fs){const meta=await uploadDraftFile(f);uploaded.push(meta);sessionStorage.setItem('gdUploadedFiles',JSON.stringify(uploaded));draw()}showAppMessage('Ֆայլերը հաջողությամբ վերբեռնվել են','success');document.getElementById('files').value=''}catch(e){showAppMessage(e.message)}finally{b.disabled=false;b.textContent='Վերբեռնել ընտրված ֆայլերը'}}})();</script></body></html>
