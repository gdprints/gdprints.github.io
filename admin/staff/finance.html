<section class="staff-section"><h2>Վերջին պատվերների ֆինանսական վիճակ</h2>

</div>
<div class="field">
<label>Մեթոդ</label><select id="fin-method"><option value="cash">Cash</option>
<option value="bank_transfer">Bank transfer</option>
<option value="online_payment">Online payment</option>
<option value="delivery_payment">Delivery payment</option>
<option value="other">Այլ</option></select>
</div>
<div class="field">
<label>Գումար AMD</label><input id="fin-amount" min="1" required="" type="number">

<div class="field">

</div>
<div class="field">
