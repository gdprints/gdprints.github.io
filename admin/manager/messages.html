<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link href="../img/logo-icon.png" rel="icon">
	<link href="../img/logo-icon.png" rel="apple-touch-icon">
<title>Հաղորդագրություններ · GDprint Manager</title>
<link rel="stylesheet" href="../shared/css/design-system.css">
<link rel="stylesheet" href="../shared/css/app-shell.css">
<style>
  .msg-shell{ display:grid; grid-template-columns: 280px 1fr; gap:18px; height: calc(100vh - 160px); }
  .conv-list{ overflow-y:auto; display:flex; flex-direction:column; gap:4px; padding:8px; }
  .conv-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; transition:background .15s ease; }
  .conv-item:hover{ background: var(--surface-solid); }
  .conv-item.active{ background: rgba(0,184,217,0.12); }
  .conv-item .name{ font-size:13.5px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msg-panel{ display:flex; flex-direction:column; }
  .msg-scroll{ flex:1; overflow-y:auto; padding:20px; }
  .msg-input-row{ display:flex; gap:8px; padding:14px; border-top:1px solid var(--border); }
  .msg-input-row input{ flex:1; padding:11px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface-solid); color:var(--text); font-size:14px; }
</style>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/admin-192.png">
<link rel="stylesheet" href="../shared/css/pwa-install.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-name"><img class="theme-logo" data-theme-logo src="../img/logo-dark.png" alt="GDprint"></div></div>
    <div class="nav-section-title">Իմ էջը</div>
    <nav>
      <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></a>
      <a href="new-order.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>Նոր պատվեր</span></a>
      <a href="analytics.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-5 4 3 5-7"/></svg><span>Անալիտիկա</span></a>
      <a href="messages.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Հաղորդագրություններ</span></a>
    </nav>
    <div class="nav-section-title">Համակարգ</div>
    <nav>
      <a href="#" class="nav-item" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span>Ելք</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar" id="user-avatar">M</div>
      <div class="sidebar-foot-text"><div class="name" id="user-name">Մենեջեր</div><div class="role">Մենեջեր</div></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <div><div class="page-title">Հաղորդագրություններ</div><div class="page-sub">⚠️ Ադմինը տեսնում է բոլոր նամակագրությունները</div></div>
      <button class="icon-btn" id="theme-toggle" style="margin-left:auto;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
    </header>

    <main class="content">
      <div class="msg-shell">
        <div class="card glass conv-list" id="conv-list"></div>
        <div class="card glass msg-panel" style="padding:0;">
          <div class="drawer-head" style="border-bottom:1px solid var(--border);">
            <div class="card-title" id="active-conv-name">Ընտրեք զրույց</div>
          </div>
          <div class="msg-scroll" id="msg-scroll"></div>
          <div class="msg-input-row" id="msg-input-row">
            <input type="text" id="msg-input" placeholder="Գրել հաղորդագրություն...">
            <button class="btn btn-primary" id="msg-send-btn">Ուղարկել</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../shared/js/vendor/supabase.js"></script>
<script src="../shared/js/supabase.js"></script>
<script src="../shared/js/ui.js"></script>
<script src="../shared/js/auth.js"></script>
<script src="../shared/js/messaging.js"></script>
<script src="../shared/js/realtime.js"></script>
<script src="js/messages.js"></script>
<script src="../shared/js/pwa-install.js"></script>
</body>
</html>
