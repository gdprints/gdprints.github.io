<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Մուտք · GDprint</title>
<link rel="stylesheet" href="shared/css/design-system.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/admin-192.png">
<link rel="stylesheet" href="shared/css/pwa-install.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card glass">
    <div class="auth-brand">
      <img class="auth-logo" style="max-width: 80%;" src="img/logo-dark.png" alt="GDprint" data-theme-logo data-logo-light="img/logo-light.png" data-logo-dark="img/logo-dark.png">
      <div class="auth-sub">Ադմին և մենեջերների մուտք</div>
    </div>

    <form id="login-form">
      <div class="field">
        <label>Էլ. հասցե</label>
        <input type="email" name="email" placeholder="you@gdprint.am" required autocomplete="username">
      </div>
      <div class="field">
        <label>Գաղտնաբառ</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <p id="login-error" style="display:none; color: var(--danger); font-size: 13px; margin: -6px 0 14px;"></p>
      <button type="submit" class="btn btn-primary btn-block">Մուտք գործել</button>
    </form>

    <div class="auth-switch">
      Դեռ մենեջեր չե՞ք հաշվում — <a href="register.html">Գրանցվել որպես մենեջեր</a>
    </div>
  </div>
</div>

<script src="shared/js/vendor/supabase.js"></script>
<script src="shared/js/supabase.js"></script>
<script src="shared/js/ui.js"></script>
<script src="shared/js/auth.js"></script>
<script src="shared/js/pwa-install.js"></script>
</body>
</html>
